- class_path: chebai.callbacks.model_checkpoint.CustomModelCheckpoint
  init_args:
    monitor: val_himol-macro-roc-auc
    mode: 'max'
    filename: 'best_himol-macro-roc-auc_{epoch:02d}_{val_loss:.4f}_{val_himol-macro-roc-auc:.4f}'
    every_n_epochs: 1
    save_top_k: 1
- class_path: chebai.callbacks.model_checkpoint.CustomModelCheckpoint
  init_args:
    filename: 'per_{epoch:02d}_{val_loss:.4f}_{val_himol-macro-roc-auc:.4f}'
    save_top_k: 1
