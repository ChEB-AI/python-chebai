class_path: torchmetrics.MetricCollection
init_args:
  metrics: # Use this for: SIDER, ClinTox, Tox21, ToxCast
    micro-f1:
      class_path: torchmetrics.classification.MultilabelF1Score
      init_args:
        average: micro
    macro-f1:
      class_path: chebai.callbacks.epoch_metrics.MacroF1
    roc-auc:
      class_path: torchmetrics.classification.MultilabelAUROC
    pr-auc: # Especially used for MUV, PCBA
      class_path: torchmetrics.classification.MultilabelAveragePrecision
